[project]
name = "sie-match-claimed-items-to-receipts"
version = "0.1.0"
description = "Match each item on a contents claim inventory to a receipt line and list the proof still needed."
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0,<13",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.10.1",
]

[dependency-groups]
data = [
    "numpy>=2",
]

[tool.uv]
package = false

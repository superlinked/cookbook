[project]
name = "sie-check-invoice-against-claim"
version = "0.1.0"
description = "Check a repair invoice against the open claim it was filed under before it is paid."
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0,<13",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.10.1",
]

[dependency-groups]
agent = [
    "anthropic>=2.6.0",
]

[tool.uv]
package = false

[project]
name = "sie-map-financial-statements-to-template"
version = "0.1.0"
description = "Map a borrower's income statement and balance sheet into the bank's template and check the totals."
requires-python = ">=3.12"
dependencies = [
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.10.1",
]

[dependency-groups]
data = ["pillow>=12.3.0,<13"]

[tool.uv]
package = false

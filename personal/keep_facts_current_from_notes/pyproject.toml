[project]
name = "sie-keep-facts-current-from-notes"
version = "0.1.0"
description = "Keep a household fact sheet current from notes, voice memos, photos and scans, with where each fact came from."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pillow>=12.3.0,<13",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.10.1",
]

[tool.uv]
package = false

[project]
name = "sie-serve-more-models-than-fit"
version = "0.1.0"
description = "Serve more small models than fit on one GPU with SIE, one of them pinned, and measure the unloads and waits."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "sie-sdk>=0.11.1",
]

[dependency-groups]
data = ["pyarrow>=17"]

[tool.uv]
package = false

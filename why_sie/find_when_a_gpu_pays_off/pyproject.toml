[project]
name = "sie-find-when-a-gpu-pays-off"
version = "0.1.0"
description = "Measure how many tokens a second bge-m3 embeds on your GPU through SIE, and when renting that GPU beats paying per call."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "sie-sdk>=0.11.1",
]

[dependency-groups]
data = ["pyarrow>=17"]

[tool.uv]
package = false

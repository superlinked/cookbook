[project]
name = "sie-share-one-gpu-between-two-sglang-models"
version = "0.1.0"
description = "Put two SGLang models on one 24 GB GPU with plain SGLang and with SIE, and measure what each keeps."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.11.1",
]

[dependency-groups]
data = ["pyarrow>=17"]

[tool.uv]
package = false

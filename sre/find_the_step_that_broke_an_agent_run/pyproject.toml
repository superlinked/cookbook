[project]
name = "sie-find-the-step-that-broke-an-agent-run"
version = "0.1.0"
description = "Find the step and the agent that broke a failed agent run: read it whole when it fits, with an RLM on SIE when it doesn't."
requires-python = ">=3.12"
dependencies = [
    "deno>=2.1",
    "dspy==3.4.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.11.0",
]

[tool.uv]
package = false

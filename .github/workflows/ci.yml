name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: CI / Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      recipes: ${{ steps.recipes.outputs.recipes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # Runs ruff, the file hygiene hooks, actionlint, tools/check_tree.py and
      # tools/check_locks.py, as locally.
      - run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure
      - id: recipes
        run: echo "recipes=$(python3 tools/check_tree.py --list-json)" >> "$GITHUB_OUTPUT"

  recipe:
    name: CI / ${{ matrix.recipe }}
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.policy.outputs.recipes) }}
    defaults:
      run:
        working-directory: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.recipe }}/uv.lock
      - run: uv lock --check
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen --with mypy==2.4.0 mypy --strict --ignore-missing-imports ./*.py
      # Offline smoke test: recipe.py and everything it imports load and the CLI parses, with no
      # SIE call. It does not load rules.yaml or the data.
      - run: uv run --frozen python recipe.py --help

  required:
    name: CI / Required
    if: always()
    needs: [policy, recipe]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a required job ended with: $result"; exit 1; }
          done

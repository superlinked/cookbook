# The store-ops rules and every threshold the recipe uses.
# Thresholds are starting points, not tuned values. Check them against your own shelf photos.

models:
  detect: IDEA-Research/grounding-dino-base   # finds the price labels in each photo
  ocr: zai-org/GLM-OCR                        # reads each label crop

detection:
  labels: ["price label"]       # the text prompt sent to the detector
  box_threshold: 0.25           # detector-side cut-offs, sent with the request
  text_threshold: 0.25
  min_score: 0.30               # boxes scoring lower are dropped before cropping
  max_box_area_fraction: 0.10   # a "label" box larger than this share of the photo is a product, not a label
  dedupe_iou: 0.50              # two boxes overlapping this much are one label: keep the higher score

crop:
  pad_fraction: 0.05            # padding around each box; keep it small so a neighbour's barcode stays out
  upscale: 2                    # enlarge the crop before OCR so the small print is legible
  max_edge_px: 2048             # cap the enlarged crop's longest side

matching:
  # A label is matched to prices.csv by its UPC first: the label prints the UPC without the
  # check digit (000-39978-00173 for 0039978001733). Only when no UPC can be read does the
  # product name decide.
  min_name_score: 0.80          # share of the price-file name's words found on the label
  min_name_margin: 0.15         # best name must beat the runner-up by this much, else escalate
  word_similarity: 0.80         # a label word counts as a name word at this similarity (OCR typos)

pricing:
  # The label's regular retail price is compared with register_price in prices.csv.
  # Promotion tags ("HEALTHY SAVINGS $5.99") and unit prices ("59.0¢ PER OZ") are not compared.
  # A label whose regular price agrees but that carries a promotion tag is not a match: it goes
  # to needs_review.csv as `promotion`, because the register may charge the promotion price.
  tolerance: 0.00               # a difference larger than this, in dollars, is a mismatch
  # OCR reads the shelf label first and the promotion tag hanging under it second. Prices on or
  # after the first line that contains one of these words belong to the promotion tag, and a
  # label with such a line carries a promotion.
  promo_markers: ["HEALTHY SAVINGS", "SAVE", "BUY ONE", "VALID THRU", "SALE"]
  # A price on a line with, or directly followed by a line starting with, one of these words is
  # a unit price.
  unit_markers: ["PER"]

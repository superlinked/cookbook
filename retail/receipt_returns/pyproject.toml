[project]
name = "sie-receipt-returns"
version = "0.1.0"
description = "Read receipt photos sent with returns and missing-points claims, and check them."
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0,<13",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.10.1",
]

[dependency-groups]
data = ["numpy>=2"]

[tool.uv]
package = false

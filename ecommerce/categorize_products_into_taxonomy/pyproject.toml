[project]
name = "sie-categorize-products-into-taxonomy"
version = "0.1.0"
description = "Give each new supplier product a taxonomy category and the attributes that category requires."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.10.1",
]

[tool.uv]
package = false

[dependency-groups]
# make_data.py needs nothing beyond the standard library.
data = []

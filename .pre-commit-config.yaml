repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=8192]
      - id: detect-private-key
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: check-tree
        name: check recipe layout and public tree
        entry: python3 tools/check_tree.py
        language: system
        pass_filenames: false
        always_run: true
      - id: uv-lock-check
        name: check each changed recipe's uv.lock
        entry: python3 tools/check_locks.py
        language: system
        files: (^|/)(pyproject\.toml|uv\.lock)$

[project]
name = "sie-route-coding-tasks-to-open-models-first"
version = "0.1.0"
description = "Send each coding task to the cheapest level that passes its tests: a linter, open models on SIE, then Claude."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "pytest>=9.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
    "sie-sdk>=0.10.1",
]

[tool.uv]
package = false

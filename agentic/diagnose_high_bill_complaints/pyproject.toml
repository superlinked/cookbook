[project]
name = "sie-diagnose-high-bill-complaints"
version = "0.1.0"
description = "Work out why a customer's water bill jumped: Claude runs the loop and its tools call small models on SIE."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "numpy>=2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.10.1",
    "vicinity>=0.4.6",
]

[dependency-groups]
data = [
    "pillow>=12.3.0,<13",
]

[tool.uv]
package = false

[project]
name = "sie-index-and-check-received-documents"
version = "0.1.0"
description = "Index a discovery volume received from the other side, check its Bates numbers and queue possible privilege."
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0,<13",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.10.1",
]

[dependency-groups]
# make_data.py needs nothing beyond pillow, which the recipe already uses to render pages.
data = []

[tool.uv]
package = false

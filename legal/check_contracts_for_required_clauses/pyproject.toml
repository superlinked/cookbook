[project]
name = "sie-check-contracts-for-required-clauses"
version = "0.1.0"
description = "Check ICT contract packages for the clauses the bank's DORA checklist requires."
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0,<13",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.10.1",
]

[dependency-groups]
data = ["pillow>=12.3.0,<13"]

[tool.uv]
package = false

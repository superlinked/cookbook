[project]
name = "sie-screen-assistant-prompts"
version = "0.1.0"
description = "Screen prompts to a security copilot: allow, block or review, with the reason."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.10.1",
]

[dependency-groups]
data = ["pillow>=12.2.0,<13"]

[tool.uv]
package = false

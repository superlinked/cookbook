# Threat-relation rules: the model ID, entity and relation labels, the alias table, which entity
# types each relation may join, and every threshold the recipe uses.
# The thresholds are starting points we did not tune. Check them on your own reports.

models:
  relations: knowledgator/gliner-relex-large-v1.0   # entities and relations in one extract call

# Entity labels sent to the model. The alias table below overrides the model's label for any
# name it lists; the model's label is used only for names the table does not know.
entity_labels: [threat actor, malware, vulnerability, sector, software, campaign]

# Relation labels sent to the model, and the entity types each one may join (head -> tail).
# A relation whose types fit only the other way round is turned round; one that fits neither
# way is dropped with a reason.
relations:
  uses:
    head: [threat actor, campaign]
    tail: [malware, software]
  exploits:
    head: [threat actor, malware, campaign]
    tail: [vulnerability]
  targets:
    head: [threat actor, malware, campaign]
    tail: [sector, software]
  attributed to:
    head: [malware, campaign]
    tail: [threat actor]
  alias of:   # never merges by itself: a new alias goes to review until it is in the table
    head: [threat actor, malware]
    tail: [threat actor, malware]

# A malware family or campaign belongs to one actor. If the reports name two actors for the
# same family, every one of those edges is flagged as conflicting.
single_valued: [attributed to]

# Negation: Python regex, case-insensitive. This recipe denies a claim only when the negation sits
# directly on it, and sends anything less clear to review.
# - Denial: both names are in one sentence, the text between them has no clause_breaks match and
#   no other tagged entity, and a pattern matches in that text or in the lookback_words words
#   just before the earlier name (not past a clause break or other entity). {verb} in a
#   pattern stands only for this relation's verbs (verbs[relation]) plus every_relation. So "We
#   found no evidence that Saltmarsh Kettle used Thornpipe" and "Velvet Gorse did not deploy
#   Thornpipe" are denials. A denied claim is not an edge: it is kept as a denial, and an edge
#   that any report denies (the same report included) is conflicting.
# - Review: otherwise, if doubt_words matches anywhere in the claim's sentence (or sentences),
#   the claim is neither edge nor denial and goes to review, and its edge is flagged. So "Velvet
#   Gorse did not use Thornpipe but used Murkbell", "Velvet Gorse, not Saltmarsh Kettle, used
#   Thornpipe" and "has not been observed using" all go to review for the claim they don't deny.
# - Edge: no negation word in the sentence. Names in different sentences are never a denial.
negation:
  lookback_words: 4
  patterns:
    - '\bno (?:evidence|indication|sign)s? (?:that|of)\b'
    - '\bno (?:link|connection) (?:between|to)\b'
    - '\b(?:do|does|did|is|are|was|were|has|have|had|can|ca|wo|could|would|will)(?:\s*not|n[''’]t)(?: been| be)? {verb}'
    - '\bnever (?:been )?{verb}'
    - '\bunrelated to\b'
    - '\bruled out\b'
  # Between the two names, any of these may start another clause (", which", ", using", "but"),
  # so a negation there may not be on the claim.
  clause_breaks: '[,;:]|\bbut\b|\binstead\b'
  # Any of these in the claim's sentence makes a claim that is not a denial go to review. It
  # covers every pattern above plus hedges such as "no longer uses", "does not appear to use",
  # "has not been observed using" and "is not known to use".
  doubt_words: '\bnot\b|n[''’]t\b|\bcannot\b|\bnever\b|\bno (?:longer|evidence|indications?|signs?|link|connection)\b|\bunrelated\b|\bruled out\b'
  verbs:   # one list per relation in `relations`
    uses: [use, uses, used, using, deploy, deploys, deployed, deploying]
    exploits: [exploit, exploits, exploited, exploiting]
    targets: [target, targets, targeted, targeting]
    attributed to: [attribute, attributes, attributed, attributing]
    alias of: []
  every_relation: [link, links, linked, linking, tie, ties, tied, tying, connect, connects,
                   connected, connecting]

# Words the model tags as entities that are never graph nodes. Matched like alias names.
not_entities: [operators, investigators, researchers, attackers, victims, defenders, we, they]

# Types whose names must be a CVE ID or an alias-table entry. The model reads phrases such as
# "code overlap" or "outbound connections" as vulnerabilities; those relations are dropped.
listed_types_only: [vulnerability]

# Canonical name, type and aliases. Names are matched case-insensitively after trimming
# punctuation, a leading "the" and a possessive ('s). CVE IDs need no entry: they are upper-cased.
aliases:
  - name: Velvet Gorse
    type: threat actor
    aliases: [Gorse Moth, TA-Gorse]
  - name: Saltmarsh Kettle
    type: threat actor
    aliases: [Reedcutter]
  - name: Thornpipe
    type: malware
    aliases: [Thornpipe backdoor, Thornpipe implant]
  - name: Murkbell
    type: malware
    aliases: [Murkbell stealer, Murkbell credential stealer]
  - name: Quillstep
    type: malware
    aliases: [Quillstep loader]
  - name: water utilities
    type: sector
    aliases: [water utility, water sector]
  - name: port operators
    type: sector
    aliases: [port operator, harbour operators, ports]
  - name: Halvard Gateway
    type: software
    aliases: [Halvard Gateway appliances, unpatched Halvard Gateway appliances]

thresholds:
  entity_threshold: 0.40      # entity span score sent to the model (relex needs at least 0.1)
  relation_threshold: 0.70    # relation score sent to the model; the model card says 0.7-0.9
  min_sources: 2              # distinct publishers an edge needs to be "corroborated"
  batch_size: 16              # paragraphs per SIE call
  max_words_per_window: 200   # longer paragraphs are split on sentences, long sentences on words

# The CTI team's triage rules: the alias table, the tool-to-ATT&CK mapping, what counts as a
# product mention and a huntable indicator, the model ID and every threshold the recipe uses. The thresholds are starting points, not tuned values, so check
# them against your own reports.
# Every actor and malware name below is fictional. The tools are real, widely documented
# admin and offensive-security tools.

models:
  entities: numind/NuNER_Zero   # tags threat actor, malware and tool spans

# Entity labels sent to NuNER Zero, as {our kind: model label}. The model card asks for
# lower-case labels. Change the label words on the right freely, but the keys are fixed: the
# code reads actor, malware and tool, and the recipe stops at start if the keys differ.
# CVEs, hashes and network IOCs are found by regex, not by the model.
labels:
  actor: threat actor
  malware: malware
  tool: tool

# The alias table: one canonical name per actor or malware family, with the names an analyst
# has confirmed mean the same thing for indexing. Vendors often track clusters that only
# partly overlap, so list an alias here only when your team treats it as the same group, never
# because two names are "related". Looking a mention up ignores case, a leading "the" and
# trailing words from `generic_words`, so "Mothvine Loader" and "the Mothvine loader" both read
# as Mothvine. The recipe's own search of the text for names the model missed ignores case too.
# If one alias sits under two canonical names, that's a real-world collision, and a
# mention of it goes to review instead of being merged with either. A canonical name itself
# goes under one section only (actors, malware or tool_techniques); the recipe refuses to start
# if it finds one in two.
actors:
  Ashen Heron: [LX-0417, Grey Lantern]
  Copper Moth: [LX-0522, Grey Lantern]
malware:
  QuillRAT: [QRAT, Quill RAT]
  Mothvine: [MothVine]
  SaltGlass: [SaltGlass Locker]

# Words dropped from the end of a name before matching ("SaltGlass ransomware" -> SaltGlass).
generic_words: [ransomware, loader, backdoor, implant, malware, dropper, stage, family,
                group, actor, operators, tool, utility, variant, threat]

# Model spans that are never names. A span made only of generic words ("threat group") is
# dropped too. They drop spans NuNER Zero was seen to tag, such as "threat group" as an actor
# and "MD5" as a tool (fitted to the demo data; extend them for your reports).
ignore_mentions: [MD5, SHA-1, SHA1, SHA-256, SHA256, CVE]

# Tools mapped to candidate ATT&CK Enterprise technique IDs: techniques the tool is commonly
# associated with, looked up by its name, not behavior the report shows ("rclone" is a backup
# tool as often as an exfiltration tool). An analyst confirms them before they feed a
# detection. Every ID must be in data/attack_techniques.csv (a small subset of MITRE ATT&CK;
# see the README for the terms of use). A tool the model finds that isn't listed here goes to
# review. We don't guess a technique.
tool_techniques:
  Mimikatz: [T1003.001]
  PsExec: [T1569.002, T1021.002]
  AdFind: [T1087.002, T1482]
  rclone: [T1567.002]
  PowerShell: [T1059.001]
  vssadmin: [T1490]
  ngrok: [T1572]

# Words that, in the same sentence as a mapped tool, hold back its candidate techniques and
# send the report to review: a negation ("No Mimikatz execution was observed") or a sign of
# routine admin use ("used rclone to back up the file server"). Matched as whole words, any
# case. It's a plain keyword check, fitted to the demo data; it over-flags ("no" anywhere in
# the sentence) and misses anything worded differently. Quote every cue: YAML reads a bare
# no as false.
technique_cues: ["no", "not", "never", "without", "back up", "backed up", "backup", "backups",
                 "legitimate", "authorized", "administrators"]

# Which name and indicator reasons send a report to review (true) or are only recorded (false).
policy:
  unknown_actor: true      # an actor name that is not in the alias table
  unknown_malware: true    # a malware name that is not in the alias table
  ambiguous_alias: true    # an alias listed under two canonical names
  unmapped_tool: true      # a tool with no ATT&CK mapping in tool_techniques
  technique_cue: true      # a technique cue next to a mapped tool (off: cues are not checked)
  live_ioc: true           # a URL written live (http://, https://) instead of defanged
  malformed_indicator: true  # a hex run that is not an MD5, SHA-1 or SHA-256 length, a
                             # defanged IP that isn't a valid address, a CVE ID with too
                             # few digits, or a defanged domain whose last label isn't
                             # letters only
# An invalid model span or a window the model failed to tag always goes to review.

# Does the report affect us? The CVEs are looked up in the scanner (scanner.py) and the products
# in the asset inventory (asset_inventory.py); the hosts, versions, aliases and owning teams
# live in their CSV seeds under data/, not here. A product name near miss, a product cue below
# or a host with no owner always goes to review: those can't be switched off.
relevance:
  # Indicator types the SOC can search the logs for. CVE IDs name a vulnerability, not
  # something you'd find in a log, so they're not on the hunt list.
  hunt_types: [url, domain, ip, md5, sha256, sha1]
  # Capitalized words after a product name or vendor that make it a longer, different name
  # ("Corvane VPN Concentrator"); this is how many are read at most.
  max_extra_name_words: 3
  # Words that, in the same sentence as a product we run, send the report to review instead
  # of drafting a ticket ("The Corvane VPN Gateway is not affected"). Whole words, any case.
  # A plain keyword check, like technique_cues. Quote every cue.
  product_cues: ["not", "no", "never", "unaffected", "isn't", "aren't"]
  # Version wording the recipe can't compare. A number right after a product name is read as
  # its version ("Corvane VPN Gateway 7.2"). Any of these words, or any digit, in the next
  # version_window_words words of the same sentence ("versions 8.0 and later", ", 7.4 only",
  # "prior to 7.0") sends the product mention to review instead of a ticket for every host
  # running it. Words inside an indicator don't count. Whole words, any case.
  version_words: ["version", "versions", "release", "releases", "build", "builds", "prior to",
                  "before", "through", "and later", "and earlier", "or later", "or earlier",
                  "up to", "only"]
  version_window_words: 4

thresholds:
  min_entity_score: 0.50       # NuNER Zero span score; lower spans are not returned
  max_words_per_window: 150    # NuNER Zero reads 384 tokens; reports are split on sentences
  min_hex_run: 24              # hex runs at least this long are hash candidates
  batch_size: 16               # windows per SIE call

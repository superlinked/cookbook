[project]
name = "sie-fine-tune-a-decision-model"
version = "0.1.0"
description = "Fine-tune a small GLiClass decision model on 100 labelled rows and compare it with the zero-shot model, on a public and a private dataset."
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.1.0",  # not imported: the transformers Trainer that gliclass uses needs it
    "gliclass>=0.1.14",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sie-sdk>=0.11.1",
    "torch>=2.5",
    "transformers>=4.51",
]

[dependency-groups]
data = ["datasets>=3.0"]

[tool.uv]
package = false

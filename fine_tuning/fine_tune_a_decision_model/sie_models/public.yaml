# Serve the model recipe.py fine-tuned on data/public/ with SIE Local or SIE Cluster.
# Copied from SIE's catalog entry for knowledgator/gliclass-edge-v3.0, with four changes:
# - a new sie_id and a description;
# - weights_path in place of hf_id and hf_revision: the folder recipe.py saved, as the
#   server sees it;
# - multi-label scoring by default, as recipe.py trains and scores, so each label gets its
#   own 0-1 score and a low top score means the model isn't sure;
# - one profile: the catalog's multi-label profile is now the default.
sie_id: my-team/banking77-router
description: GLiClass edge v3.0 fine-tuned on 102 Banking77 messages (six intents)
weights_path: /weights/public
inputs:
  text: true
  image: false
  audio: false
  video: false
tasks:
  encode: null
  score: null
  extract: {}
max_sequence_length: 1024
profiles:
  default:
    max_batch_tokens: 16384
    compute_precision: null
    adapter_path: sie_server.adapters.gliclass:GLiClassAdapter
    adapter_options:
      loadtime:
        classification_type: multi-label
      runtime:
        threshold: 0.0

# The maintenance team's rules and every threshold the recipe uses.
# The thresholds are starting points we did not tune. Check them on your own manuals and questions.

models:
  # One vector per patch of each page image, and one per query token. We use the model's
  # `:compact` profile (same weights, at most 768 patch vectors per page instead of 1,280)
  # because on 29 Oct 2026 SIE Serverless answered every encode on the default profile with
  # HTTP 503 'missing rate for model=..., profile="default"'.
  embed: TomoroAI/tomoro-colqwen3-embed-4b:compact
  answer: Qwen/Qwen3.8-27B-FP8               # reads the best page image and answers with a page cite

render:
  # Each PDF page is rendered to a PNG at this resolution before it is encoded. Lower means fewer
  # patch vectors per page (a smaller index); text must stay legible.
  encode_dpi: 72
  # The page the LLM reads is rendered sharper, so small diagram labels stay readable.
  answer_dpi: 150

search:
  # Page score = MaxSim (each query vector's best match anywhere on the page, summed) divided by
  # the number of query vectors, so it reads as an average similarity between -1 and 1 however
  # long the question is. Only pages of the unit's manual revision (from the work order) count.
  # If none of them scores this much, the status is no_reliable_match and no LLM call is made. A
  # low score is a hint, not proof the manual doesn't cover the question.
  min_score: 0.50
  # How many ranked pages each answer lists, so a reader can check the runners-up.
  show_top: 3

answer:
  # The LLM reads the best page and, if that page does not answer, the next page at or above
  # search.min_score, up to this many pages. A contents page often outranks the page it points to.
  max_pages: 2
  max_completion_tokens: 3000   # includes any reasoning the model does first
  # A quote counts as verified when, after collapsing whitespace and straightening quote marks,
  # it appears in the text printed on the cited page (data/manual.json) and is at least this long.
  # 12 characters, because shorter quotes prove nothing: a tag ("V3", "S1", "TB1"), a terminal or
  # step number ("2", "8") or a bare value ("20 N m", "4.6 kg") can sit on a page by coincidence
  # and doesn't say what it belongs to. At 12 the quote has to carry its label too: "Refrigerant
  # charge 4.6 kg" is 25, "V3" plus "reservoir drain" is 17.
  min_quote_chars: 12
  # A quote split with "..." or over lines (several labels of one diagram) passes when every
  # piece is on the page, in order. A piece shorter than min_quote_chars only counts when it sits
  # at most this many characters from the piece next to it on the page (after whitespace is
  # collapsed). On this manual a tag and its label, or a value and its row label, are one space
  # apart; 5 leaves room for a separator like ": ". So "V3" + "reservoir drain" passes, while
  # "remote start/stop" + "9" (a terminal from further down the block) does not.
  max_gap_chars: 5
  # Every number in the answer (20, 4.6, 1/2, -15, 25Nm) and every tag or part number in it (V1,
  # TB1, E07, R-513A, BTS-2207) must also be in the quote, so a true quote can't carry a
  # different value or a different valve in the answer. A tag the question itself names (e.g.
  # CR-220) may appear in the answer without being quoted.
  values_in_quote: true
  # A number the answer gives with a unit must be in the quote with that same unit, so a quote
  # that has "75" only as "O-ring 75 x 3 mm" can't back "tighten the bolts to 75 N m". Each
  # spelling on the left maps to the unit on the right; a space inside a spelling also matches no
  # space ("N m" = "Nm"), and the number may be glued to the unit or spaced ("25Nm", "25 N m").
  # Longer spellings are tried first. A number with no unit after it keeps the plain number rule.
  units:
    "N m": Nm
    Nm: Nm
    kg: kg
    bar: bar
    "°C": C
    C: C
    kW: kW
    V: V
    mA: mA
    A: A
    Hz: Hz
    mm2: mm2
    mm: mm
    "L/min": L/min
    L: L
    min: min
    h: h
    s: s
    months: month
    month: month
    "dB(A)": dB(A)
    "%": "%"
  # The model sometimes copies the page footer onto the end of its answer ("... in a cross
  # pattern. Page 8 of 8"). A tail matching this pattern (Python regex, matched case-insensitively
  # at the very end of the answer only) is cut off before the number check and before the answer
  # is shown. Nothing else in the answer is touched, so "Page 8" inside a sentence is still
  # checked. Change it if your manual prints a different footer. A "page_number: 8" tail (the
  # JSON key leaking into the answer, seen once on 31 Oct 2026) is not a footer and is not cut;
  # its 8 is still checked.
  trailing_footer: '\s*\(?\bPage\s+\d+\s+of\s+\d+\)?\.?\s*$'

# Every question ends with one of these three statuses. They say what the checks found; the
# technician decides what to do, from the cited page.
statuses:
  # A draft answer with a page cite that matches and a quote printed on that page. The quote is
  # checked, the answer sentence is not.
  quote_checked: quote_checked
  # A page was read but the reply did not hold up, or an SIE call failed. No answer is shown.
  review: review
  # No page of the unit's revision scored search.min_score: no reliable match in the pages read.
  no_reliable_match: no_reliable_match
